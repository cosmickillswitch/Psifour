<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1b20">
<title>Psi Phi Notes</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#18181d;--bar:#222229;--panel:#2a2a32;--panel2:#34343e;--ink:#ededf3;--muted:#9b9bab;--rule:#3a3a46;--accent:#e0a458;--accent2:#58c4dd;--desk:#3a3b42}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:4px;padding:calc(5px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));background:var(--bar);border-bottom:1px solid var(--rule);flex:none;min-width:0}
#docTitle{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:170px;min-width:60px;font-weight:600;text-overflow:ellipsis}
#docTitle:focus{border-color:var(--rule);background:var(--panel);outline:none}
#tools{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;justify-content:flex-start}
#tools>:first-child{margin-left:auto}#tools>:last-child{margin-right:auto}
#tools::-webkit-scrollbar{display:none}
.grow{flex:1}
.tb{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 7px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink);white-space:nowrap;flex:none;position:relative;touch-action:manipulation}
.tb:hover{background:var(--panel2)}
.tb.on{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .dot{position:absolute;bottom:3px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px}
.sep{width:1px;height:24px;background:var(--rule);margin:0 4px;flex:none}
#opts{display:flex;align-items:center;gap:5px;padding:5px max(10px,env(safe-area-inset-left));background:#1f1f26;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;flex:none;min-height:44px}
#opts::-webkit-scrollbar{display:none}
#opts select,#opts input[type=number]{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:4px 6px;height:32px}
#opts label{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted);font-size:13px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;flex:none;padding:0;position:relative}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.add{display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:none}
.sw.add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;white-space:nowrap;flex:none}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--panel2)}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wdot{display:inline-block;border-radius:50%;background:currentColor}
input[type=range]{accent-color:var(--accent)}
#panes{flex:1;display:flex;min-height:0;position:relative;background:var(--desk)}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;flex:1 1 0;background:var(--desk)}
.pane.active .phead{box-shadow:inset 0 -2px 0 var(--accent)}
.phead{display:flex;align-items:center;gap:4px;height:34px;padding:0 6px;background:#26262d;border-bottom:1px solid var(--rule);flex:none;font-size:13px}
.phead .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.phead .pt:hover{background:var(--panel2)}
.phead .pg{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.phead .tb{min-width:28px;height:28px;padding:0 5px}
.only1 .phead .pclose{display:none}
.vp{position:relative;flex:1;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vp canvas{position:absolute;left:0;top:0;pointer-events:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.page{position:absolute}
.page.clip{overflow:hidden}
.obj{position:absolute;transform-origin:50% 50%}
.obj img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.obj video{width:100%;height:100%;display:block;background:#000}
.obj.fig .badge{position:absolute;right:4px;bottom:4px;font:600 10px/1 system-ui;padding:3px 5px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;pointer-events:none}
.playfig{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;padding-left:4px}
.playfig.mini{width:34px;height:34px;margin:0;left:auto;top:auto;right:6px;top:6px;font-size:14px}
.obj.selected-obj{outline:none}
.tx{position:absolute;transform-origin:0 0;color:#1d1d1f;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:18px;line-height:1.4;word-wrap:break-word;overflow-wrap:break-word;white-space:normal;padding:4px 6px;min-height:1.4em;outline:none;cursor:text}
.tx.sticky{padding:16px 16px;box-shadow:0 6px 16px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.2);border-radius:2px;min-height:160px}
.tx.editing{outline:2px solid rgba(88,196,221,.8);outline-offset:2px;-webkit-user-select:text;user-select:text;cursor:text;z-index:5}
.tx p,.tx div{margin:0}
.tx h1{font-size:1.75em;margin:.15em 0;line-height:1.2}
.tx h2{font-size:1.35em;margin:.15em 0;line-height:1.25}
.tx h3{font-size:1.12em;margin:.1em 0}
.tx ul,.tx ol{margin:.1em 0;padding-left:1.5em}
.tx ul.check{list-style:none;padding-left:1.6em}
.tx ul.check li{position:relative}
.tx ul.check li::before{content:"";position:absolute;left:-1.45em;top:.28em;width:.85em;height:.85em;border:1.5px solid currentColor;border-radius:3px;cursor:pointer}
.tx ul.check li.done{text-decoration:line-through;opacity:.6}
.tx ul.check li.done::before{background:currentColor;box-shadow:inset 0 0 0 2px #fff}
.tx table{border-collapse:collapse;margin:.2em 0}
.tx td,.tx th{border:1px solid rgba(0,0,0,.35);padding:3px 8px;min-width:40px;vertical-align:top}
.tx th{background:rgba(0,0,0,.06);font-weight:600}
.tx a{color:#2f6fde}
.tx blockquote{margin:.2em 0;padding-left:.8em;border-left:3px solid rgba(0,0,0,.25)}
.tx code{font-family:"IBM Plex Mono",monospace;background:rgba(0,0,0,.06);padding:0 .2em;border-radius:3px}
.tx hr{border:none;border-top:1px solid rgba(0,0,0,.3)}
.dark .tx td,.dark .tx th{border-color:rgba(255,255,255,.35)}
.ui{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:1.5px dashed var(--accent2);pointer-events:none}
.hd{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:2px solid var(--accent2);pointer-events:auto;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hd.rot{background:var(--accent2)}
.hd.wd{border-radius:5px;width:12px;height:30px;margin:-15px 0 0 -6px}
.selbar{position:absolute;display:flex;gap:2px;padding:4px;background:#2b2b33;border:1px solid var(--rule);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:auto;white-space:nowrap;transform:translateX(-50%);z-index:3}
.selbar button{border:none;background:transparent;color:var(--ink);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.selbar button:hover{background:var(--panel2)}
.selbar .sws{display:flex;gap:4px;align-items:center;padding:0 4px}
.selbar .sws i{width:18px;height:18px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,.25)}
.pfoot{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;pointer-events:none}
.pfoot>*{pointer-events:auto}
.fab{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--rule);background:rgba(34,34,41,.92);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.zoomlab{min-width:54px;justify-content:center;font-variant-numeric:tabular-nums}
.divider{flex:none;width:8px;background:#141418;cursor:col-resize;touch-action:none;position:relative}
.divider::after{content:"";position:absolute;left:3px;top:50%;width:2px;height:40px;margin-top:-20px;border-radius:1px;background:#555}
.pane iframe{flex:1;border:none;width:100%;background:#1b1b20}
.thumbs{position:absolute;left:0;top:34px;bottom:0;width:190px;background:#202027;border-right:1px solid var(--rule);overflow-y:auto;z-index:4;padding:10px 10px 60px;box-shadow:6px 0 18px rgba(0,0,0,.35)}
.thumb{position:relative;margin:0 auto 12px;cursor:pointer;text-align:center}
.thumb canvas{display:block;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.5);border-radius:2px;max-width:100%}
.thumb.cur canvas{outline:3px solid var(--accent);outline-offset:2px}
.thumb .n{font-size:11px;color:var(--muted);margin-top:4px}
.thumb .tm{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:13px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.thumbs .addpg{width:100%;margin-top:4px}
/* library */
#library{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#libTop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:var(--bar);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand b{color:var(--accent)}
.brand svg{width:26px;height:26px}
#libSearch{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:7px 10px;width:220px;max-width:40vw}
#libBody{flex:1;display:flex;min-height:0}
#libSide{width:220px;flex:none;border-right:1px solid var(--rule);overflow-y:auto;padding:10px 8px;background:#1d1d23}
#libSide .fi{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#libSide .fi:hover{background:var(--panel)}
#libSide .fi.on{background:var(--panel2);color:var(--accent)}
#libSide h4{margin:14px 9px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#libMain{flex:1;overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right)) 80px 18px}
.crumbs{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:20px;font-weight:700;flex-wrap:wrap}
.crumbs span{cursor:pointer;opacity:.6}.crumbs span:last-child{opacity:1;cursor:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.card{cursor:pointer;position:relative;min-width:0}
.cover{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;overflow:hidden;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.4);display:grid;place-items:center;background:#fff}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.nb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.18);z-index:1}
.cover.board{aspect-ratio:4/3;border-radius:10px}
.cover.folder{background:none;box-shadow:none;aspect-ratio:4/3}
.cover.folder svg{width:84%;height:84%}
.cover .kind{position:absolute;left:18px;bottom:8px;font:700 10px/1 system-ui;letter-spacing:.05em;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;z-index:2}
.cover .ttl{position:absolute;left:22px;right:10px;top:24px;font:700 15px/1.2 system-ui;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2}
.card .nm{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.card .dt{font-size:11.5px;color:var(--muted)}
.card .more{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:15px;border:none;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;z-index:3}
.empty{color:var(--muted);padding:40px 0;text-align:center;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1306;font-weight:600}
.btn.quiet{background:transparent}
.btn.danger{color:#ff8a80}
/* menus and dialogs */
.menu{position:fixed;z-index:60;min-width:220px;max-width:min(340px,92vw);max-height:min(72vh,620px);overflow-y:auto;background:#2b2b33;border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:5px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--panel2);outline:none}
.menu button .ic{width:22px;text-align:center;flex:none;opacity:.9}
.menu button .sub{margin-left:auto;color:var(--muted);font-size:12px}
.menu h5{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.menu hr{border:none;border-top:1px solid var(--rule);margin:4px 6px}
.menu .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
dialog{background:#26262d;color:var(--ink);border:1px solid var(--rule);border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:18px 18px 14px}
.dlg h2{margin:0 0 12px;font-size:18px}
.dlg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.dlg .row.end{justify-content:flex-end}
.dlg label.f{display:block;margin:10px 0 4px;color:var(--muted);font-size:12.5px}
.dlg input[type=text],.dlg select{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--rule);border-radius:10px;padding:6px;cursor:pointer;background:var(--panel);text-align:center;font-size:12px;width:84px}
.opt.on{border-color:var(--accent)}
.opt canvas{display:block;margin:0 auto 4px;background:#fff;border-radius:3px}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols i{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.cols i.on{border-color:#fff}
#ov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#ov .ovbar{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--bar);border-bottom:1px solid var(--rule)}
#ov iframe{flex:1;border:none;width:100%;background:#111}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#33333d;color:var(--ink);padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:90;max-width:min(560px,90vw);font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#measure{position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none}
.ptabs{display:none}
@media (max-width:760px){
  #docTitle{width:110px;flex:1}
  #top{flex-wrap:wrap;row-gap:2px}
  #tools{order:9;flex-basis:100%;border-top:1px solid var(--rule);padding-top:3px}
  #libSide{display:none}
  .divider{display:none}
  .pane:not(.active){display:none}
  .ptabs{display:flex;gap:4px;padding:4px 8px;background:#1d1d23;border-bottom:1px solid var(--rule);overflow-x:auto;flex:none}
  .ptabs:empty{display:none}
  .ptabs button{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:4px 10px;white-space:nowrap;font-size:12.5px;cursor:pointer}
  .ptabs button.on{border-color:var(--accent);color:var(--accent)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px 12px}
}
@media print{
  body *{visibility:hidden}
  #printOut,#printOut *{visibility:visible}
  #printOut{position:absolute;left:0;top:0}
  #printOut img{display:block;width:100%;page-break-after:always;break-after:page}
  html,body{overflow:visible;height:auto;background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="libBtn" class="tb" type="button" title="Library" aria-label="Library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <input id="docTitle" aria-label="Document name" spellcheck="false">
    <div id="tools" role="toolbar" aria-label="Tools"></div>
    <button id="undoBtn" class="tb" type="button" title="Undo (two-finger tap)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redoBtn" class="tb" type="button" title="Redo (three-finger tap)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="sep"></span>
    <button id="insBtn" class="tb" type="button" title="Insert" aria-label="Insert"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="pagesBtn" class="tb" type="button" title="Pages" aria-label="Pages"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="15" rx="1.5"/><path d="M8 21h11V7"/></svg></button>
    <button id="splitBtn" class="tb" type="button" title="Side by side" aria-label="Open beside"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
    <button id="moreBtn" class="tb" type="button" title="More" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </header>
  <div id="opts"></div>
  <div id="ptabs" class="ptabs"></div>
  <main id="panes"></main>
</div>
<section id="library" aria-label="Library">
  <div id="libTop">
    <a class="brand" href="index.html" title="Back to Psi Phi Studio"><svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="44" fill="#000"/><path d="M40 150 C 70 150 75 55 100 55 C 125 55 130 150 160 150" fill="none" stroke="#58C4DD" stroke-width="12" stroke-linecap="round"/><circle cx="100" cy="55" r="15" fill="#F0AC5F"/><circle cx="62" cy="122" r="9" fill="#FC6255"/><circle cx="138" cy="122" r="9" fill="#83C167"/></svg><span>Psi Phi <b>Notes</b></span></a>
    <span class="grow"></span>
    <input id="libSearch" type="search" placeholder="Search" aria-label="Search notes">
    <select id="libSort" class="btn" aria-label="Sort"><option value="updated">Last edited</option><option value="name">Name</option><option value="created">Created</option></select>
    <button id="libNew" class="btn primary" type="button">＋ New</button>
    <button id="libClose" class="btn quiet" type="button" hidden>Back to notes ›</button>
  </div>
  <div id="libBody"><nav id="libSide" aria-label="Folders"></nav><div id="libMain"></div></div>
</section>
<div id="toast" role="status"></div>
